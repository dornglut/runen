name: Scratch 840 lowering artifact

on: push

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 39a1673f0b84a3f15ac77d917f0e01c2a454a870
          persist-credentials: false

      - name: Apply exact lowering patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import subprocess

          path = Path("crates/runen-core-lowering/src/lib.rs")
          expected_blob = "bdbd02f4d59a042393b5137a37af018a06188227"
          actual_blob = subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()
          if actual_blob != expected_blob:
              raise SystemExit(f"unexpected lowering blob: expected {expected_blob}, got {actual_blob}")

          encoded_pairs = [
              ("", ""),
              ("", ""),
              ("Ly8vIExvd2VyIG9uZSBhY2NlcHRlZCB0eXBlZCBISVIgY29tcGlsYXRpb24gaW50byB2YWxpZGF0ZWQgQ29yZSB0b2dldGhlciB3aXRoCi8vLyB0aGUgZXhhY3Qgb3JkaW5hcnkgbm9uLWdlbmVyaWMgZnVuY3Rpb24gY29ycmVzcG9uZGVuY2UgcmV0YWluZWQgYnkgbG93ZXJpbmcuCg==", "Ly8vIExvd2VyIG9uZSBhY2NlcHRlZCB0eXBlZCBISVIgY29tcGlsYXRpb24gaW50byB2YWxpZGF0ZWQgQ29yZSB0b2dldGhlciB3aXRoCi8vLyB0aGUgZXhhY3Qgb3JkaW5hcnktZnVuY3Rpb24gYW5kIGV4dGVybmFsLWRlY2xhcmF0aW9uIGNvcnJlc3BvbmRlbmNlcyByZXRhaW5lZAovLy8gYnkgbG93ZXJpbmcuCg=="),
              ("ICAgIGZuIGxvd2VyKHNlbGYpIC0+IFJlc3VsdDxMb3dlcmVkQ29tcGlsYXRpb24sIExvd2VyaW5nRXJyb3I+IHsKICAgICAgICBsZXQgb3JkaW5hcnlfZnVuY3Rpb25zID0gc2VsZi5vcmRpbmFyeV9mdW5jdGlvbl9jb3JyZXNwb25kZW5jZSgpPzsKICAgICAgICBsZXQgY2FwYWNpdHkgPSBzZWxmCg==", ""),
              ("ICAgICAgICBPayhMb3dlcmVkQ29tcGlsYXRpb24gewogICAgICAgICAgICBwcm9ncmFtLAogICAgICAgICAgICBvcmRpbmFyeV9mdW5jdGlvbnMsCiAgICAgICAgfSkK", "ICAgICAgICBPayhMb3dlcmVkQ29tcGlsYXRpb24gewogICAgICAgICAgICBwcm9ncmFtLAogICAgICAgICAgICBvcmRpbmFyeV9mdW5jdGlvbnMsCiAgICAgICAgICAgIGV4dGVybmFsX2Z1bmN0aW9ucywKICAgICAgICB9KQo="),
          ]

          text = path.read_text()
          for old64, new64 in encoded_pairs:
              old = base64.b64decode(old64).decode()
              new = base64.b64decode(new64).decode()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one replacement site, found {count}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git diff --check
          changed="$(git diff --name-only)"
          test "${changed}" = "crates/runen-core-lowering/src/lib.rs"
          mkdir -p scratch-artifact
          cp crates/runen-core-lowering/src/lib.rs scratch-artifact/lib.rs
          git diff -- crates/runen-core-lowering/src/lib.rs > scratch-artifact/lowering.patch
          git hash-object crates/runen-core-lowering/src/lib.rs > scratch-artifact/lowering.blob

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scratch-840-lowering-candidate
          path: scratch-artifact
          if-no-files-found: error
          retention-days: 1
