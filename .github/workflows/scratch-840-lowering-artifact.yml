name: Scratch 840 driver cleanup transfer

on: push

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-840-hir-external-providers
          persist-credentials: true

      - name: Verify exact PR head and apply cleanup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a9fa7c9c2827cb9fe3c5e32ddd5bac56cc643953"
          python - <<'PY'
          from pathlib import Path

          lib = Path("crates/runen-core-wasm-driver/src/lib.rs")
          text = lib.read_text()
          old = "matches!(self.implementation, ProviderImplementation::ScalarResult(_))"
          new = "matches!(&self.implementation, ProviderImplementation::ScalarResult(_))"
          if text.count(old) != 1:
              raise SystemExit("driver has_result replacement site changed")
          lib.write_text(text.replace(old, new, 1))

          composition = Path("crates/runen-core-wasm-driver/tests/composition.rs")
          text = composition.read_text()
          old = '''#[test]
fn external_declarations_are_rejected_before_provider_composition_is_exposed() {
    let compilation =
        compilation("external fn transform(I64) -> I64; fn entry() -> I64 { return 1; }");

    assert!(matches!(
        RealizedCompilation::new(&compilation),
        Err(BuildError::ExternalDeclarationsUnsupported)
    ));
}
'''
          new = '''#[test]
fn external_declarations_without_provider_fail_in_hir_terms() {
    let compilation =
        compilation("external fn transform(I64) -> I64; fn entry() -> I64 { return 1; }");
    let transform = function(&compilation, "transform");

    assert!(matches!(
        RealizedCompilation::new(&compilation),
        Err(BuildError::MissingExternalProvider(function)) if function == transform
    ));
}
'''
          if text.count(old) != 1:
              raise SystemExit("composition replacement site changed")
          composition.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "crates/runen-core-wasm-driver/src/lib.rs crates/runen-core-wasm-driver/tests/composition.rs "
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/runen-core-wasm-driver/src/lib.rs crates/runen-core-wasm-driver/tests/composition.rs
          git commit -m "Fix driver provider composition cleanup"
          git push origin HEAD:issue-840-hir-external-providers
