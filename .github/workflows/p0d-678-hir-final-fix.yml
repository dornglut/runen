name: Temporary P0-D 678 HIR final fix

on:
  push:
    branches:
      - p0d-678-source-function-values-impl
    paths:
      - .github/workflows/p0d-678-hir-final-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p0d-678-source-function-values-impl
          fetch-depth: 1
      - name: Apply guarded HIR corrections and conformance
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          build = Path('crates/runen-hir/src/build.rs')
          text = build.read_text()

          helper_name = 'fn derive_safe_reference_result_contract('
          assert helper_name not in text, 'shared contract helper already exists unexpectedly'

          # Share the declaration/function-type safe-reference result-contract relation.
          helper_anchor = 'fn validate_safe_reference_referent(\n'
          assert text.count(helper_anchor) == 1
          helper = '''fn derive_safe_reference_result_contract(
              parameter_types: &[Type],
              result: Option<Type>,
              type_location: SourceLocation,
              diagnostics: &mut Vec<Diagnostic>,
          ) -> Option<SafeReferenceResultContract> {
              let Some(Type::SafeReference {
                  referent,
                  permission: ReferencePermission::Shared,
              }) = result
              else {
                  return Some(SafeReferenceResultContract::None);
              };

              let shared = Type::SafeReference {
                  referent,
                  permission: ReferencePermission::Shared,
              };
              let mut matching_shared = parameter_types
                  .iter()
                  .enumerate()
                  .filter(|(_, parameter)| **parameter == shared);
              match (matching_shared.next(), matching_shared.next()) {
                  (Some((origin, _)), None) => {
                      Some(SafeReferenceResultContract::SharedIdentity { origin })
                  }
                  (Some(_), Some(_)) => {
                      diagnostics.push(Diagnostic {
                          kind: DiagnosticKind::AmbiguousSharedReferenceResultOrigin,
                          location: type_location,
                      });
                      None
                  }
                  (None, _) => {
                      let replacement = Type::SafeReference {
                          referent,
                          permission: ReferencePermission::ExclusiveReplace,
                      };
                      let mut matching_replacement = parameter_types
                          .iter()
                          .enumerate()
                          .filter(|(_, parameter)| **parameter == replacement);
                      match (matching_replacement.next(), matching_replacement.next()) {
                          (Some((origin, _)), None) => {
                              Some(SafeReferenceResultContract::SharedDirectChild { origin })
                          }
                          (None, _) => {
                              diagnostics.push(Diagnostic {
                                  kind: DiagnosticKind::MissingSharedReferenceResultOrigin,
                                  location: type_location,
                              });
                              None
                          }
                          (Some(_), Some(_)) => {
                              diagnostics.push(Diagnostic {
                                  kind: DiagnosticKind::AmbiguousSharedReferenceResultOrigin,
                                  location: type_location,
                              });
                              None
                          }
                      }
                  }
              }
          }

          '''
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          # Replace declaration-local duplicate derivation while preserving existing error behavior:
          # invalid contract records diagnostics and leaves the provisional contract as None.
          header_start = text.index('        let mut safe_reference_result_contract = SafeReferenceResultContract::None;')
          block_start = text.index('                if let Type::SafeReference {\n', header_start)
          block_end = text.index('                Some(ty)\n            });', block_start)
          replacement = '''                let parameter_types = parameters
                      .iter()
                      .map(|parameter| parameter.ty)
                      .collect::<Vec<_>>();
                  if let Some(contract) = derive_safe_reference_result_contract(
                      &parameter_types,
                      Some(ty),
                      location(function.unit, &type_node),
                      diagnostics,
                  ) {
                      safe_reference_result_contract = contract;
                  }
          '''
          text = text[:block_start] + replacement + text[block_end:]

          # Replace function-type-local duplicate derivation with the same helper. Invalid
          # function-type contracts reject the type exactly as before.
          function_type_start = text.index('fn resolve_function_type(')
          contract_start = text.index('    let safe_reference_result_contract = if let Some(Type::SafeReference {\n', function_type_start)
          contract_end = text.index('    Some(Type::Function(intern_function_type(', contract_start)
          replacement = '''    let safe_reference_result_contract = derive_safe_reference_result_contract(
              &parameters,
              result,
              location(context.names.unit, node),
              diagnostics,
          )?;

          '''
          text = text[:contract_start] + replacement + text[contract_end:]

          # Accepted source execution establishes the bounded indirect callee transient before
          # argument-count admission. The callable is duplicable, so this has no state mutation,
          # but the defensive validation/diagnostic order must still match the semantic owner.
          call_start = text.index('fn validate_call_inner(')
          arg_start = text.index('    if argument_nodes.len() != application.parameter_types.len() {', call_start)
          callee_start = text.index('    if let CallTarget::Indirect { binding, .. } = &application.target {', arg_start)
          args_eval_start = text.index('    let mut arguments = Vec::with_capacity(argument_nodes.len());', callee_start)
          arg_block = text[arg_start:callee_start]
          callee_block = text[callee_start:args_eval_start]
          text = text[:arg_start] + callee_block + arg_block + text[args_eval_start:]

          build.write_text(text)

          edges = Path('crates/runen-hir/tests/function_value_edges.rs')
          edge_text = edges.read_text()
          additions = r'''

          #[test]
          fn indirect_generic_type_arguments_reject_before_consuming_argument_state() {
              let errors = build(
                  "record Ticket {} \
                   fn sink(value: Ticket) {} \
                   fn use(f: fn(Ticket), ticket: Ticket) { f[I64](ticket); sink(ticket); }",
              )
              .expect_err("indirect generic arguments are rejected before ordinary argument effects");
              assert!(has_diagnostic(
                  &errors,
                  DiagnosticKind::UnexpectedGenericTypeArguments
              ));
              assert!(
                  !has_diagnostic(&errors, DiagnosticKind::UnavailableBinding),
                  "rejected indirect generic arguments must not consume the ordinary argument"
              );
          }

          #[test]
          fn local_shadowing_is_final_for_function_value_formation() {
              let errors = build(
                  "fn target(value: I64) -> I64 { return value; } \
                   fn use(target: I64) { let f: fn(I64) -> I64 = target; }",
              )
              .expect_err("active local binding must block module-function fallback during formation");
              assert!(errors.iter().any(|error| matches!(
                  error.kind,
                  DiagnosticKind::TypeMismatch {
                      expected: Type::Function(_),
                      found: Type::Intrinsic(runen_hir::IntrinsicType::I64),
                  }
              )));
          }

          #[test]
          fn indirect_static_interface_controls_argument_and_result_types() {
              let argument_errors = build(
                  "fn use(f: fn(I64) -> I64) -> I64 { return f(true); }",
              )
              .expect_err("indirect argument type comes from the static function-value type");
              assert!(argument_errors.iter().any(|error| matches!(
                  error.kind,
                  DiagnosticKind::TypeMismatch {
                      expected: Type::Intrinsic(runen_hir::IntrinsicType::I64),
                      found: Type::Intrinsic(runen_hir::IntrinsicType::Bool),
                  }
              )));

              let result_errors = build(
                  "fn use(f: fn(I64) -> I64) { let value: Bool = f(1); }",
              )
              .expect_err("indirect result type comes from the static function-value type");
              assert!(result_errors.iter().any(|error| matches!(
                  error.kind,
                  DiagnosticKind::TypeMismatch {
                      expected: Type::Intrinsic(runen_hir::IntrinsicType::Bool),
                      found: Type::Intrinsic(runen_hir::IntrinsicType::I64),
                  }
              )));
          }

          #[test]
          fn function_values_do_not_gain_source_equality() {
              build(
                  "fn left(value: I64) -> I64 { return value; } \
                   fn right(value: I64) -> I64 { return value; } \
                   fn bad() -> Bool { \
                       let a: fn(I64) -> I64 = left; \
                       let b: fn(I64) -> I64 = right; \
                       return a == b; \
                   }",
              )
              .expect_err("function identity has no represented source equality operation");
          }
          '''
          for name in [
              'indirect_generic_type_arguments_reject_before_consuming_argument_state',
              'local_shadowing_is_final_for_function_value_formation',
              'indirect_static_interface_controls_argument_and_result_types',
              'function_values_do_not_gain_source_equality',
          ]:
              assert name not in edge_text
          edges.write_text(edge_text + additions)

          focused = Path('crates/runen-hir/tests/function_values.rs')
          focused_text = focused.read_text()
          name = 'unequal_function_type_structures_use_distinct_canonical_handles'
          assert name not in focused_text
          focused_text += r'''

          #[test]
          fn unequal_function_type_structures_use_distinct_canonical_handles() {
              let hir = build(
                  "fn use( \
                       a: fn(I64) -> I64, \
                       b: fn(Bool) -> I64, \
                       c: fn(I64) -> Bool, \
                       identity: fn(&I64) -> &I64, \
                       child: fn(&mut I64) -> &I64 \
                   ) {}",
              )
              .expect("distinct concrete function-type structures are valid");
              let use_fn = function(&hir, "use");
              let a = function_type(use_fn.parameters[0].ty);
              let b = function_type(use_fn.parameters[1].ty);
              let c = function_type(use_fn.parameters[2].ty);
              let identity = function_type(use_fn.parameters[3].ty);
              let child = function_type(use_fn.parameters[4].ty);
              assert_ne!(a, b);
              assert_ne!(a, c);
              assert_ne!(identity, child);
              assert_eq!(
                  hir.function_type(identity).safe_reference_result_contract,
                  SafeReferenceResultContract::SharedIdentity { origin: 0 }
              );
              assert_eq!(
                  hir.function_type(child).safe_reference_result_contract,
                  SafeReferenceResultContract::SharedDirectChild { origin: 0 }
              );
          }
          '''
          focused.write_text(focused_text)
          PY
      - name: Format
        run: cargo +stable fmt --all
      - name: Focused HIR function-value conformance
        run: cargo +stable test -p runen-hir --test function_values --test function_value_edges
      - name: Full HIR regression
        run: cargo +stable test -p runen-hir
      - name: HIR Clippy all targets
        run: cargo +stable clippy -p runen-hir --all-targets -- -D warnings
      - name: Full lowering regression
        run: cargo +stable test -p runen-core-lowering
      - name: Lowering Clippy all targets
        run: cargo +stable clippy -p runen-core-lowering --all-targets -- -D warnings
      - name: Commit corrections and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "Aschenrot"
          git config user.email "128308156+aschenrot@users.noreply.github.com"
          git rm .github/workflows/p0d-678-hir-final-fix.yml
          git add crates/runen-hir/src/build.rs crates/runen-hir/tests/function_values.rs crates/runen-hir/tests/function_value_edges.rs
          git diff --cached --quiet && { echo "Expected final #678 corrections" >&2; exit 1; }
          git commit -m "P0-D: align indirect call admission and callable contracts"
          git push origin HEAD:p0d-678-source-function-values-impl
