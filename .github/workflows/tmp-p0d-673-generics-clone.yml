name: Temporary P0-D 673 generics ownership adaptation

on:
  push:
    branches:
      - p0d-673-core-callable-values-impl

permissions:
  contents: write

jobs:
  adapt:
    if: ${{ !contains(github.event.head_commit.message, '[skip-673-generics-clone]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p0d-673-core-callable-values-impl
          persist-credentials: true
          fetch-depth: 0
      - name: Apply compiler-proven ownership adaptation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/runen-core-lowering/tests/generics.rs')
          text = path.read_text()
          old = 'TypeKind::Scalar(scalar) => Some(*scalar),'
          new = 'TypeKind::Scalar(scalar) => Some(scalar.clone()),'
          if text.count(old) != 1:
              raise SystemExit(f'expected one replacement, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          cargo +stable fmt --all
      - name: Enforce bounded scope
        shell: bash
        run: |
          actual="$(git diff --name-only)"
          if [[ "${actual}" != "crates/runen-core-lowering/tests/generics.rs" ]]; then
            echo "Unexpected changed paths:" >&2
            echo "${actual}" >&2
            exit 1
          fi
      - run: cargo +stable test -p runen-core-lowering --test generics
      - name: Commit bounded adaptation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/runen-core-lowering/tests/generics.rs
          git commit -m 'test: adapt generic lowering fixture to non-Copy ScalarType [skip-673-generics-clone]'
          git push origin HEAD:p0d-673-core-callable-values-impl
