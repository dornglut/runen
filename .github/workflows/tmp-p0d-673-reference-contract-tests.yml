name: Temporary P0-D 673 reference contract tests

on:
  push:
    branches:
      - p0d-673-core-callable-values-impl

permissions:
  contents: write

jobs:
  contracts:
    if: ${{ !contains(github.event.head_commit.message, '[skip-673-reference-contracts]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p0d-673-core-callable-values-impl
          persist-credentials: true
          fetch-depth: 0
      - name: Add indirect safe-reference contract conformance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/runen-reference/tests/callable_values.rs')
          s = p.read_text()
          old = '''    LocalId, Operand, Place, Program, SafeReferenceResultContract, ScalarType, Statement,\n    Terminator, TypeDef, TypeTable, Value, validate_program,\n'''
          new = '''    LocalId, Operand, Place, Program, ReferenceAccess, ReferencePermission,\n    SafeReferenceResultContract, ScalarType, Statement, Terminator, TypeDef, TypeTable, Value,\n    validate_program,\n'''
          if s.count(old) != 1:
              raise SystemExit('unexpected callable_values import shape')
          s = s.replace(old, new, 1)
          marker = 'fn indirect_shared_identity_result_preserves_caller_reference_authority'
          if marker in s:
              raise SystemExit('contract tests already present')
          s += r'''

#[test]
fn indirect_shared_identity_result_preserves_caller_reference_authority() {
    let mut types = TypeTable::new();
    let i64_ty = types.push(TypeDef::scalar("I64", ScalarType::I64));
    let shared_i64 = types.push(TypeDef::reference(
        "SharedI64",
        i64_ty,
        ReferencePermission::Shared,
    ));
    let callable = types.push(TypeDef::callable(
        "SharedIdentity",
        CallableInterface::new(
            vec![shared_i64],
            Some(shared_i64),
            SafeReferenceResultContract::SharedIdentity { origin: 0 },
        ),
    ));
    let target = Place::local(LocalId(0));
    let reference = Place::local(LocalId(1));
    let returned = Place::local(LocalId(2));

    let caller = Function {
        name: "caller".into(),
        parameters: Vec::new(),
        result: Some(i64_ty),
        safe_reference_result_contract: SafeReferenceResultContract::None,
        body: body(
            vec![
                LocalDecl::new("target", i64_ty, false),
                LocalDecl::new("reference", shared_i64, false),
                LocalDecl::new("returned", shared_i64, false),
            ],
            vec![
                BasicBlock::new(
                    vec![
                        Statement::Init {
                            dst: target.clone(),
                            src: Operand::Constant(Value::I64(29)),
                        },
                        Statement::Init {
                            dst: reference.clone(),
                            src: Operand::ReferenceRoot {
                                permission: ReferencePermission::Shared,
                                place: target.clone(),
                            },
                        },
                    ],
                    Terminator::IndirectCall {
                        callable,
                        callee: Operand::FunctionValue(FunctionId(1)),
                        arguments: vec![Operand::Move(reference.into())],
                        destination: Some(returned.clone()),
                        target: BasicBlockId(1),
                    },
                ),
                BasicBlock::new(
                    vec![
                        Statement::ReferenceRead {
                            src: ReferenceAccess::new(returned.clone()),
                        },
                        Statement::Drop {
                            place: returned.into(),
                        },
                    ],
                    Terminator::Return(Some(Operand::Move(target.into()))),
                ),
            ],
        ),
    };
    let identity = Function {
        name: "identity".into(),
        parameters: vec![LocalId(0)],
        result: Some(shared_i64),
        safe_reference_result_contract: SafeReferenceResultContract::SharedIdentity { origin: 0 },
        body: body(
            vec![LocalDecl::new("reference", shared_i64, false)],
            vec![BasicBlock::new(
                Vec::new(),
                Terminator::Return(Some(Operand::Move(Place::local(LocalId(0)).into()))),
            )],
        ),
    };

    let report = execute(Program {
        types,
        functions: vec![caller, identity],
    });
    assert_eq!(report.terminal, TerminalStatus::Returned);
    assert_eq!(report.result, Some(ObservedValue::I64(29)));
}

#[test]
fn indirect_shared_direct_child_result_preserves_ancestry_until_child_destruction() {
    let mut types = TypeTable::new();
    let i64_ty = types.push(TypeDef::scalar("I64", ScalarType::I64));
    let shared_i64 = types.push(TypeDef::reference(
        "SharedI64",
        i64_ty,
        ReferencePermission::Shared,
    ));
    let replace_i64 = types.push(TypeDef::reference(
        "ReplaceI64",
        i64_ty,
        ReferencePermission::ExclusiveReplace,
    ));
    let callable = types.push(TypeDef::callable(
        "SharedDirectChild",
        CallableInterface::new(
            vec![replace_i64],
            Some(shared_i64),
            SafeReferenceResultContract::SharedDirectChild { origin: 0 },
        ),
    ));
    let target = Place::local(LocalId(0));
    let parent = Place::local(LocalId(1));
    let returned = Place::local(LocalId(2));
    let new_parent = Place::local(LocalId(3));

    let caller = Function {
        name: "caller".into(),
        parameters: Vec::new(),
        result: Some(i64_ty),
        safe_reference_result_contract: SafeReferenceResultContract::None,
        body: body(
            vec![
                LocalDecl::new("target", i64_ty, true),
                LocalDecl::new("parent", replace_i64, false),
                LocalDecl::new("returned", shared_i64, false),
                LocalDecl::new("new_parent", replace_i64, false),
            ],
            vec![
                BasicBlock::new(
                    vec![
                        Statement::Init {
                            dst: target.clone(),
                            src: Operand::Constant(Value::I64(53)),
                        },
                        Statement::Init {
                            dst: parent.clone(),
                            src: Operand::ReferenceRoot {
                                permission: ReferencePermission::ExclusiveReplace,
                                place: target.clone(),
                            },
                        },
                    ],
                    Terminator::IndirectCall {
                        callable,
                        callee: Operand::FunctionValue(FunctionId(1)),
                        arguments: vec![Operand::Move(parent.into())],
                        destination: Some(returned.clone()),
                        target: BasicBlockId(1),
                    },
                ),
                BasicBlock::new(
                    vec![
                        Statement::ReferenceRead {
                            src: ReferenceAccess::new(returned.clone()),
                        },
                        Statement::Drop {
                            place: returned.into(),
                        },
                        Statement::Init {
                            dst: new_parent.clone(),
                            src: Operand::ReferenceRoot {
                                permission: ReferencePermission::ExclusiveReplace,
                                place: target.clone(),
                            },
                        },
                        Statement::ReferenceRead {
                            src: ReferenceAccess::new(new_parent.clone()),
                        },
                        Statement::Drop {
                            place: new_parent.into(),
                        },
                    ],
                    Terminator::Return(Some(Operand::Move(target.into()))),
                ),
            ],
        ),
    };
    let direct_child = Function {
        name: "direct_child".into(),
        parameters: vec![LocalId(0)],
        result: Some(shared_i64),
        safe_reference_result_contract: SafeReferenceResultContract::SharedDirectChild {
            origin: 0,
        },
        body: body(
            vec![
                LocalDecl::new("parent", replace_i64, false),
                LocalDecl::new("child", shared_i64, false),
            ],
            vec![BasicBlock::new(
                vec![Statement::Init {
                    dst: Place::local(LocalId(1)),
                    src: Operand::ReferenceReborrow {
                        permission: ReferencePermission::Shared,
                        src: ReferenceAccess::new(Place::local(LocalId(0))),
                    },
                }],
                Terminator::Return(Some(Operand::Move(Place::local(LocalId(1)).into()))),
            )],
        ),
    };

    let report = execute(Program {
        types,
        functions: vec![caller, direct_child],
    });
    assert_eq!(report.terminal, TerminalStatus::Returned);
    assert_eq!(report.result, Some(ObservedValue::I64(53)));
}
'''
          p.write_text(s)
          PY
      - run: cargo +stable fmt --all
      - name: Enforce bounded test scope
        shell: bash
        run: |
          test "$(git diff --name-only)" = 'crates/runen-reference/tests/callable_values.rs'
      - run: cargo +stable test -p runen-reference --test callable_values
      - name: Commit contract tests only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/runen-reference/tests/callable_values.rs
          git commit -m 'test: cover indirect safe-reference result contracts [skip-673-reference-contracts]'
          git push origin HEAD:p0d-673-core-callable-values-impl
