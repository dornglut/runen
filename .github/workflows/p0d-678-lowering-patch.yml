name: Temporary P0-D 678 implementation audit

on:
  push:
    branches:
      - p0d-678-source-function-values-impl
    paths:
      - .github/workflows/p0d-678-lowering-patch.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p0d-678-source-function-values-impl
          fetch-depth: 1
      - name: Correct nested-callable conformance assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/runen-core-lowering/tests/function_values.rs')
          s = p.read_text()
          old = '''    assert_eq!(outer.result, Some(
                  function(program, "higher")
                      .result
                      .expect("higher callable parameter's interface returns I64")
              ));
          '''
          new = '''    let inner = &callables
                  .iter()
                  .find(|(id, _)| *id == inner_id)
                  .expect("nested callable mapping exists")
                  .1;
              assert_eq!(outer.result, inner.result);
          '''
          assert s.count(old) == 1, f'nested callable assertion matches: {s.count(old)}'
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format focused conformance
        run: cargo +stable fmt --all
      - name: Focused function-value lowering/reference conformance
        run: cargo +stable test -p runen-core-lowering --test function_values
      - name: Full lowering regression
        run: cargo +stable test -p runen-core-lowering
      - name: Lowering Clippy all targets
        run: cargo +stable clippy -p runen-core-lowering --all-targets -- -D warnings
      - name: Focused HIR function-value edges
        run: cargo +stable test -p runen-hir --test function_value_edges
      - name: Full HIR regression
        run: cargo +stable test -p runen-hir
      - name: HIR Clippy all targets
        run: cargo +stable clippy -p runen-hir --all-targets -- -D warnings
      - name: Commit focused conformance corrections
        run: |
          set -euo pipefail
          git config user.name "Aschenrot"
          git config user.email "128308156+aschenrot@users.noreply.github.com"
          git add crates/runen-core-lowering/tests/function_values.rs crates/runen-hir/tests/function_value_edges.rs
          git diff --cached --quiet && { echo "No conformance changes produced" >&2; exit 1; }
          git commit -m "P0-D: complete function-value conformance"
          git push origin HEAD:p0d-678-source-function-values-impl
