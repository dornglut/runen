name: Temporary P0-D 678 implementation audit

on:
  push:
    branches:
      - p0d-678-source-function-values-impl
    paths:
      - .github/workflows/p0d-678-lowering-patch.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p0d-678-source-function-values-impl
          fetch-depth: 1
      - name: Format check
        run: cargo +stable fmt --all -- --check
      - name: Focused function-value lowering/reference conformance
        run: cargo +stable test -p runen-core-lowering --test function_values
      - name: Full lowering regression
        run: cargo +stable test -p runen-core-lowering
      - name: Lowering Clippy all targets
        run: cargo +stable clippy -p runen-core-lowering --all-targets -- -D warnings
      - name: Full HIR regression
        run: cargo +stable test -p runen-hir
      - name: HIR Clippy all targets
        run: cargo +stable clippy -p runen-hir --all-targets -- -D warnings
