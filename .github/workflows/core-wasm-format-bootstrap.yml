name: Core Wasm Format Bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    name: Capture rustfmt output
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact pull-request head
        id: revision
        shell: bash
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "${PULL_REQUEST_HEAD_SHA}"
          echo "expected_revision=${PULL_REQUEST_HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ steps.revision.outputs.expected_revision }}

      - name: Prove checked-out revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ steps.revision.outputs.expected_revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_REVISION}"

      - name: Install stable rustfmt
        shell: bash
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Format repository Rust sources
        shell: bash
        run: cargo +stable fmt --all

      - name: Capture formatted Core Wasm sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-wasm-rustfmt-output
          path: |
            crates/runen-core-wasm/src/*.rs
            crates/runen-core-wasm/tests/*.rs
          if-no-files-found: error
          retention-days: 1
