name: Core Wasm Format Bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    name: Apply exact rustfmt output
    if: >-
      github.event.pull_request.number == 795 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'issue-794-core-wasm-realization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact pull-request head
        id: revision
        shell: bash
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test -n "${PULL_REQUEST_HEAD_SHA}"
          test "${PULL_REQUEST_HEAD_REF}" = "issue-794-core-wasm-realization"
          echo "expected_revision=${PULL_REQUEST_HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "head_ref=${PULL_REQUEST_HEAD_REF}" >> "${GITHUB_OUTPUT}"

      - name: Check out exact revision with bounded push credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: true
          ref: ${{ steps.revision.outputs.expected_revision }}

      - name: Prove checked-out revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ steps.revision.outputs.expected_revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_REVISION}"

      - name: Install stable rustfmt
        shell: bash
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Format repository Rust sources
        shell: bash
        run: cargo +stable fmt --all

      - name: Commit only formatted Core Wasm Rust sources
        shell: bash
        env:
          HEAD_REF: ${{ steps.revision.outputs.head_ref }}
        run: |
          set -euo pipefail
          git diff --check
          git add crates/runen-core-wasm/src crates/runen-core-wasm/tests
          if git diff --cached --quiet; then
            echo "Core Wasm Rust sources are already rustfmt-clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply stable rustfmt to Core Wasm"
          git push origin "HEAD:${HEAD_REF}"
