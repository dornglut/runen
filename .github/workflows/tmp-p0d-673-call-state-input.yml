name: Temporary P0-D 673 call-state descriptor

on:
  push:
    branches:
      - p0d-673-core-callable-values-impl

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[skip-673-call-state-input]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p0d-673-core-callable-values-impl
          persist-credentials: true
          fetch-depth: 0
      - name: Bundle call-specific state inputs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/runen-core-ir/src/interprocedural_validation.rs')
          text = path.read_text()
          old = (
              "                    validate_call_state(\n"
              "                        types,\n"
              "                        body,\n"
              "                        &mut state,\n"
              "                        &interface,\n"
              "                        None,\n"
              "                        arguments,\n"
              "                        destination,\n"
              "                        &point,\n"
              "                    )?,\n"
          )
          new = (
              "                    validate_call_state(\n"
              "                        types,\n"
              "                        body,\n"
              "                        &mut state,\n"
              "                        CallStateInput {\n"
              "                            interface: &interface,\n"
              "                            callee: None,\n"
              "                            arguments,\n"
              "                            destination,\n"
              "                        },\n"
              "                        &point,\n"
              "                    )?,\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one direct call-state invocation, found {text.count(old)}')
          text = text.replace(old, new)
          old = (
              "                    validate_call_state(\n"
              "                        types,\n"
              "                        body,\n"
              "                        &mut state,\n"
              "                        interface,\n"
              "                        Some(callee),\n"
              "                        arguments,\n"
              "                        destination,\n"
              "                        &point,\n"
              "                    )?,\n"
          )
          new = (
              "                    validate_call_state(\n"
              "                        types,\n"
              "                        body,\n"
              "                        &mut state,\n"
              "                        CallStateInput {\n"
              "                            interface,\n"
              "                            callee: Some(callee),\n"
              "                            arguments,\n"
              "                            destination,\n"
              "                        },\n"
              "                        &point,\n"
              "                    )?,\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one indirect call-state invocation, found {text.count(old)}')
          text = text.replace(old, new)
          old = (
              "fn validate_call_state(\n"
              "    types: &TypeTable,\n"
              "    body: &Body,\n"
              "    state: &mut ValidationState,\n"
              "    interface: &CallableInterface,\n"
              "    callee: Option<&Operand>,\n"
              "    arguments: &[Operand],\n"
              "    destination: &Option<Place>,\n"
              "    point: &MirPoint,\n"
              ") -> Result<DefinedStep<()>, MirValidationError> {\n"
              "    if let Some(destination) = destination {\n"
          )
          new = (
              "struct CallStateInput<'a> {\n"
              "    interface: &'a CallableInterface,\n"
              "    callee: Option<&'a Operand>,\n"
              "    arguments: &'a [Operand],\n"
              "    destination: &'a Option<Place>,\n"
              "}\n\n"
              "fn validate_call_state(\n"
              "    types: &TypeTable,\n"
              "    body: &Body,\n"
              "    state: &mut ValidationState,\n"
              "    call: CallStateInput<'_>,\n"
              "    point: &MirPoint,\n"
              ") -> Result<DefinedStep<()>, MirValidationError> {\n"
              "    let CallStateInput {\n"
              "        interface,\n"
              "        callee,\n"
              "        arguments,\n"
              "        destination,\n"
              "    } = call;\n\n"
              "    if let Some(destination) = destination {\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one call-state function signature, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          cargo +stable fmt --all
      - name: Enforce bounded source scope
        shell: bash
        run: |
          actual="$(git diff --name-only)"
          if [[ "${actual}" != "crates/runen-core-ir/src/interprocedural_validation.rs" ]]; then
            echo "Unexpected changed paths:" >&2
            echo "${actual}" >&2
            exit 1
          fi
      - run: cargo +stable clippy -p runen-core-ir --all-targets -- -D warnings
      - run: cargo +stable test -p runen-core-ir --test callable_values --test callable_conformance_edges
      - name: Commit bounded refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/runen-core-ir/src/interprocedural_validation.rs
          git commit -m 'refactor: bundle shared call-state inputs [skip-673-call-state-input]'
          git push origin HEAD:p0d-673-core-callable-values-impl
