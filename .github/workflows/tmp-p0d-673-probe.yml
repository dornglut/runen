name: Temporary P0-D 673 patch check

on:
  push:
    branches:
      - p0d-673-core-callable-values-impl

jobs:
  patch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/tmp_p0d_673_patch.py
      - name: Check Core IR after patch
        run: cargo check -p runen-core-ir
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-validator
          path: crates/runen-core-ir/src/interprocedural_validation.rs
          retention-days: 1
