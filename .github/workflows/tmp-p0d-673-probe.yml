name: Temporary P0-D 673 validator commit

on:
  push:
    branches:
      - p0d-673-core-callable-values-impl

permissions:
  contents: write

jobs:
  patch-validator:
    if: ${{ !contains(github.event.head_commit.message, '[skip-673-validator]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p0d-673-core-callable-values-impl
          persist-credentials: true
          fetch-depth: 0
      - run: python3 tools/tmp_p0d_673_patch.py
      - name: Check Core IR after patch
        run: cargo check -p runen-core-ir
      - name: Commit validator only
        run: |
          if git diff --quiet -- crates/runen-core-ir/src/interprocedural_validation.rs; then
            echo 'No validator changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/runen-core-ir/src/interprocedural_validation.rs
          git commit -m 'P0-D: validate callable values and indirect calls [skip-673-validator]'
          git push origin HEAD:p0d-673-core-callable-values-impl
