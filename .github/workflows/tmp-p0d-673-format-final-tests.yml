name: Temporary P0-D 673 final test formatting

on:
  push:
    branches:
      - p0d-673-core-callable-values-impl

permissions:
  contents: write

jobs:
  format-tests:
    if: ${{ !contains(github.event.head_commit.message, '[skip-673-format-final-tests]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p0d-673-core-callable-values-impl
          persist-credentials: true
          fetch-depth: 0
      - run: cargo +stable fmt --all
      - name: Enforce bounded formatting scope
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(crates/runen-core-ir/tests/callable_conformance_edges.rs|crates/runen-reference/tests/callable_lifecycle_edges.rs)$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected changed paths:" >&2
            echo "${unexpected}" >&2
            exit 1
          fi
          if [[ -z "$(git diff --name-only)" ]]; then
            echo "Expected final callable test formatting changes but found none" >&2
            exit 1
          fi
      - run: cargo +stable test -p runen-core-ir --test callable_conformance_edges
      - run: cargo +stable test -p runen-reference --test callable_lifecycle_edges
      - name: Commit bounded formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/runen-core-ir/tests/callable_conformance_edges.rs crates/runen-reference/tests/callable_lifecycle_edges.rs
          git commit -m 'test: format and verify final #673 conformance [skip-673-format-final-tests]'
          git push origin HEAD:p0d-673-core-callable-values-impl
