name: Temporary P0-D 673 A0 update

on:
  push:
    branches:
      - p0d-673-core-callable-values-impl

permissions:
  contents: write

jobs:
  a0:
    if: ${{ !contains(github.event.head_commit.message, '[skip-673-a0]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p0d-673-core-callable-values-impl
          persist-credentials: true
          fetch-depth: 0
      - run: python3 tools/tmp_p0d_673_a0.py
      - name: Enforce bounded documentation scope
        shell: bash
        run: |
          test "$(git diff --name-only)" = 'docs/verification/a0.md'
      - name: Commit A0 update only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/a0.md
          git commit -m 'docs: map callable values into A0 verification [skip-673-a0]'
          git push origin HEAD:p0d-673-core-callable-values-impl
