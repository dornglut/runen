                  "A function-value type is also not admitted as the referent of `SharedRef` or `ExclusiveReplaceRef`, or as the pointee of `RawPtr`, because `concrete-syntax.md` does not add `FunctionType` to `ReferenceReferentType`.",
                  "A function-value type is also not admitted as the referent of `SharedRef` or `ExclusiveReplaceRef`, or as the pointee of `RawPtr`. `references.md` retains the Shared/replacement referent domain and `raw-pointers-unsafe.md` retains the raw-pointee domain; `concrete-syntax.md` correspondingly does not add `FunctionType` to `ReferenceReferentType`.",
                  "function-values reference ownership boundary")
              return s
          edit("spec/language/source/function-values.md", fv)

          # Guard against accidental implementation or Core edits.
          allowed = {
              "spec/language/source/README.md",
              "spec/language/source/types.md",
              "spec/language/source/callables.md",
              "spec/language/source/names-modules.md",
              "spec/language/source/local-bindings.md",
