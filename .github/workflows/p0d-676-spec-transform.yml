              s = once(s,
                  "A direct call used as a body statement is language-valid only when its resolved and, when generic, instantiated callable signature specifies no result value.",
                  "A `Call` used as a body statement is language-valid only when its statically established callable interface—resolved/instantiated direct target or function-value local type for a bounded indirect call—specifies no result value.",
                  "syntax CallStatement semantics")
              # Bare qualified value forms may now also form function values under exact context.
              s = s.replace("is source-valid only when qualified lookup selects an exported constant", "is source-valid as a constant only when qualified lookup selects an exported constant; under an exact required function-value type it may instead form an exported non-generic function value through `function-values.md`")
              s = s.replace("A bare qualified constant reference", "A bare qualified constant-or-function-value candidate")
              return s
          edit("spec/language/source/concrete-syntax.md", syntax)

