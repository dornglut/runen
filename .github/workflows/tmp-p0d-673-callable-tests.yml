name: Temporary P0-D 673 callable tests

on:
  push:
    branches:
      - p0d-673-core-callable-values-impl

permissions:
  contents: write

jobs:
  callable-tests:
    if: ${{ !contains(github.event.head_commit.message, '[skip-673-callable-tests]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p0d-673-core-callable-values-impl
          persist-credentials: true
          fetch-depth: 0
      - run: cargo +stable fmt --all
      - name: Enforce bounded formatting scope
        shell: bash
        run: |
          expected=$'crates/runen-core-ir/tests/callable_values.rs\ncrates/runen-reference/tests/callable_values.rs'
          actual="$(git diff --name-only)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Unexpected changed paths:" >&2
            echo "${actual}" >&2
            exit 1
          fi
      - run: cargo +stable test -p runen-core-ir --test callable_values
      - run: cargo +stable test -p runen-reference --test callable_values
      - name: Commit formatted callable tests only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/runen-core-ir/tests/callable_values.rs crates/runen-reference/tests/callable_values.rs
          git commit -m 'test: format and verify #673 callable conformance [skip-673-callable-tests]'
          git push origin HEAD:p0d-673-core-callable-values-impl
