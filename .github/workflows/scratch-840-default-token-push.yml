name: Scratch 840 default-token push test

on: push

jobs:
  push-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: scratch-840-lowering-external-map
          persist-credentials: true
      - name: Try branch-local marker push
        shell: bash
        run: |
          set -euo pipefail
          printf 'default-token-push-test\n' > .scratch-840-default-token-marker
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .scratch-840-default-token-marker
          git commit -m 'Scratch: default token push marker'
          git push origin HEAD:scratch-840-lowering-external-map
