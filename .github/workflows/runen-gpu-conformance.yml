name: Runen U32 GPU API Conformance

on:
  pull_request:
    branches:
      - main
    paths:
      - "crates/runen-core-gpu/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ARCHITECTURE.md"
      - ".github/workflows/runen-gpu-conformance.yml"
  push:
    branches:
      - main
    paths:
      - "crates/runen-core-gpu/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ARCHITECTURE.md"
      - ".github/workflows/runen-gpu-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runen-u32-gpu-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lavapipe:
    name: Source-derived GPU API compute and readback (software Vulkan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve event-specific revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) expected="$PR_HEAD_SHA" ;;
            push|workflow_dispatch) expected="$EVENT_SHA" ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          test -n "$expected"
          echo "expected_revision=$expected" >> "$GITHUB_OUTPUT"
      - name: Checkout exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.revision.outputs.expected_revision }}
          persist-credentials: false
          clean: true
      - name: Prove exact reviewed revision
        env:
          EXPECTED_REVISION: ${{ steps.revision.outputs.expected_revision }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          echo "Expected Runen revision: $EXPECTED_REVISION"
          echo "Checked-out Runen revision: $actual_revision"
          test "$actual_revision" = "$EXPECTED_REVISION"
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Mesa Vulkan fallback
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-tools xvfb xauth libxkbcommon-x11-0
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=${RUNNER_TEMP}/runen-gpu-xdg" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/runen-gpu-xdg"
          chmod 700 "${RUNNER_TEMP}/runen-gpu-xdg"
      - name: Identify admitted software Vulkan adapter
        run: vulkaninfo --summary
      - name: Execute Runen-generated U32 shader and read back
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          cargo +stable test --locked -p runen-core-gpu \
            native_runen_source_derived_u32_kernel_executes_and_reads_back \
            -- --ignored --nocapture --test-threads=1
      - name: Record limitation
        run: |
          echo "This job proves real RunenGPU API submission/readback using software Vulkan." 
          echo "It does not qualify a non-software hardware GPU adapter."

  metal-hardware:
    name: Source-derived U32 GPU API readback (Apple paravirtual Metal)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Resolve exact event revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) expected="$PR_HEAD_SHA" ;;
            push|workflow_dispatch) expected="$EVENT_SHA" ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          test -n "$expected"
          echo "expected_revision=$expected" >> "$GITHUB_OUTPUT"
      - name: Checkout exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.revision.outputs.expected_revision }}
          persist-credentials: false
          clean: true
      - name: Prove checked out revision and ARM64 Metal host
        env:
          EXPECTED_REVISION: ${{ steps.revision.outputs.expected_revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          sw_vers
          echo "Host architecture: $(uname -m)"
          test "$(uname -m)" = "arm64"
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Prove generated Runen U32 kernel through Metal API
        env:
          RUST_BACKTRACE: "1"
          WGPU_BACKEND: metal
          RUNEN_GPU_USE_METAL_API: "1"
        run: |
          set -euo pipefail
          cargo +stable test --locked -p runen-core-gpu \
            native_runen_source_derived_u32_kernel_executes_and_reads_back \
            -- --ignored --nocapture --test-threads=1
      - name: Record adapter qualification boundary
        run: |
          echo "Metal API execution and readback only: Apple Paravirtual may report Unknown software/fallback."
          echo "Do not classify this as independently confirmed hardware GPU execution."
          echo "Manual hardware qualification requires RUNEN_GPU_REQUIRE_HARDWARE=1 on a real GPU host."
