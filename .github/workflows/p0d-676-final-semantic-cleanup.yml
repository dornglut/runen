name: Temporary P0-D 676 final semantic cleanup

on:
  push:
    branches:
      - p0d-676-source-function-values-spec
    paths:
      - .github/workflows/p0d-676-final-semantic-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: p0d-676-source-function-values-spec
      - name: Prove editing surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only 30984bf3d20b732ccfb0c7a41fa6eb177405db9c..HEAD | sort)" = "$(printf '%s\n' '.github/scripts/p0d_676_final_cleanup.py' '.github/workflows/p0d-676-final-semantic-cleanup.yml' | sort)"
      - name: Apply exact replacements
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/the accepted Core/The accepted Core/g' .github/scripts/p0d_676_final_cleanup.py
          python3 .github/scripts/p0d_676_final_cleanup.py
          git diff --check
      - name: Commit normative cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aschenrot"
          git config user.email "128308156+aschenrot@users.noreply.github.com"
          git add spec/language/source
          test -n "$(git diff --cached --name-only)"
          git commit -m "docs: complete source callable integration for #676"
          git push origin HEAD:p0d-676-source-function-values-spec
