name: Temporary P0-D 678 syntax patch

on:
  push:
    branches:
      - p0d-678-source-function-values-impl
    paths:
      - .github/scripts/p0d_678_syntax_patch.py
      - .github/workflows/p0d-678-syntax-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p0d-678-source-function-values-impl
          fetch-depth: 1
      - name: Apply bounded syntax patch
        run: python .github/scripts/p0d_678_syntax_patch.py
      - name: Format affected Rust code
        run: cargo +stable fmt --all
      - name: Test syntax crate
        run: cargo +stable test -p runen-syntax
      - name: Commit syntax implementation
        run: |
          set -euo pipefail
          git config user.name "Aschenrot"
          git config user.email "128308156+aschenrot@users.noreply.github.com"
          git add crates/runen-syntax/src/lib.rs crates/runen-syntax/src/parser.rs crates/runen-syntax/tests crates/runen-hir crates/runen-core-lowering
          git diff --cached --quiet && { echo "No implementation changes produced" >&2; exit 1; }
          git commit -m "P0-D: implement neutral call and function-type syntax"
          git push origin HEAD:p0d-678-source-function-values-impl
