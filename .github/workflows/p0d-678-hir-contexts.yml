name: Temporary P0-D 678 HIR context cleanup

on:
  push:
    branches:
      - p0d-678-source-function-values-impl
    paths:
      - .github/scripts/p0d_678_hir_contexts.py
      - .github/scripts/p0d_678_hir_contexts_fix.py
      - .github/workflows/p0d-678-hir-contexts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p0d-678-source-function-values-impl
          fetch-depth: 1
      - name: Apply resolution context cleanup
        run: |
          python .github/scripts/p0d_678_hir_contexts_fix.py
          python .github/scripts/p0d_678_hir_contexts.py
      - name: Format
        run: cargo +stable fmt --all
      - name: Test HIR
        run: cargo +stable test -p runen-hir
      - name: Clippy HIR all targets
        run: cargo +stable clippy -p runen-hir --all-targets -- -D warnings
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "Aschenrot"
          git config user.email "128308156+aschenrot@users.noreply.github.com"
          git add crates/runen-hir/src/build.rs
          git diff --cached --quiet && { echo "No cleanup changes produced" >&2; exit 1; }
          git commit -m "P0-D: tighten HIR resolution contexts"
          git push origin HEAD:p0d-678-source-function-values-impl
