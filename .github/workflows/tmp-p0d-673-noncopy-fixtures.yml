name: Temporary P0-D 673 non-Copy fixtures

on:
  push:
    branches:
      - p0d-673-core-callable-values-impl

permissions:
  contents: write

jobs:
  adapt:
    if: ${{ !contains(github.event.head_commit.message, '[skip-673-noncopy-fixtures]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p0d-673-core-callable-values-impl
          persist-credentials: true
          fetch-depth: 0
      - name: Adapt Core arithmetic floating fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['floating_division.rs', 'floating_multiplication.rs', 'floating_subtraction.rs']:
              p = Path('crates/runen-core-ir/tests') / name
              s = p.read_text()
              for old, new in [
                  ('TypeDef::scalar(format!("float-{index}"), scalar)', 'TypeDef::scalar(format!("float-{index}"), scalar.clone())'),
                  ('left: Operand::Constant(zero_value(scalar)),', 'left: Operand::Constant(zero_value(scalar.clone())),') ,
                  ('right: Operand::Constant(zero_value(scalar)),', 'right: Operand::Constant(zero_value(scalar.clone())),') ,
              ]:
                  c = s.count(old)
                  if c != 1:
                      raise SystemExit(f'{name}: expected one {old!r}, found {c}')
                  s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Adapt Core floating constants fixture by borrowing scalar kind
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/runen-core-ir/tests/floating_constants.rs')
          s = p.read_text()
          replacements = [
              ('fn program_initializing(scalar: ScalarType, value: Value) -> Program {', 'fn program_initializing(scalar: &ScalarType, value: Value) -> Program {'),
              ('TypeDef::scalar("scalar", scalar)', 'TypeDef::scalar("scalar", scalar.clone())'),
              ('fn wrapped(scalar: ScalarType, value: BinaryFloatValue) -> Value {', 'fn wrapped(scalar: &ScalarType, value: BinaryFloatValue) -> Value {'),
              ('fn assert_valid(scalar: ScalarType, value: BinaryFloatValue) {', 'fn assert_valid(scalar: &ScalarType, value: BinaryFloatValue) {'),
              ('fn assert_invalid(scalar: ScalarType, value: BinaryFloatValue) {', 'fn assert_invalid(scalar: &ScalarType, value: BinaryFloatValue) {'),
              ('assert_valid(scalar, positive_zero);', 'assert_valid(&scalar, positive_zero);'),
              ('assert_valid(scalar, negative_zero);', 'assert_valid(&scalar, negative_zero);'),
              ('assert_valid(scalar, positive_infinity);', 'assert_valid(&scalar, positive_infinity);'),
              ('assert_valid(scalar, negative_infinity);', 'assert_valid(&scalar, negative_infinity);'),
              ('wrapped(scalar, positive_zero)', 'wrapped(&scalar, positive_zero)'),
              ('wrapped(scalar, negative_zero)', 'wrapped(&scalar, negative_zero)'),
              ('wrapped(scalar, positive_infinity)', 'wrapped(&scalar, positive_infinity)'),
              ('wrapped(scalar, negative_infinity)', 'wrapped(&scalar, negative_infinity)'),
              ('assert_valid(scalar, value);', 'assert_valid(&scalar, value);'),
              ('assert_invalid(scalar, value);', 'assert_invalid(&scalar, value);'),
              ('program_initializing(scalar, value)', 'program_initializing(&scalar, value)'),
          ]
          for old, new in replacements:
              c = s.count(old)
              if c != 1:
                  raise SystemExit(f'floating_constants.rs: expected one {old!r}, found {c}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Adapt reference multiplication fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/runen-reference/tests/floating_multiplication.rs')
          s = p.read_text()
          replacements = [
              ('TypeDef::scalar("float", scalar)', 'TypeDef::scalar("float", scalar.clone())'),
              ('left: Operand::Constant(constant(scalar, left)),', 'left: Operand::Constant(constant(scalar.clone(), left)),') ,
              ('let report = execute_float_mul_with_contract(contract, scalar, left, right);', 'let report = execute_float_mul_with_contract(contract, scalar.clone(), left, right);'),
              ('                scalar,\n                positive_normal(one_significand, 1),', '                scalar.clone(),\n                positive_normal(one_significand, 1),'),
              ('let (format, _, _, _) = oracle_format(scalar);', 'let (format, _, _, _) = oracle_format(scalar.clone());'),
              ('let values = deterministic_nonzero_finite_values(scalar);', 'let values = deterministic_nonzero_finite_values(scalar.clone());'),
              ('exact_nonzero_finite(scalar, *left);', 'exact_nonzero_finite(scalar.clone(), *left);'),
              ('exact_nonzero_finite(scalar, *right);', 'exact_nonzero_finite(scalar.clone(), *right);'),
              ('assert_mul(scalar, *left, *right, observed_from_oracle(expected));', 'assert_mul(scalar.clone(), *left, *right, observed_from_oracle(expected));'),
          ]
          for old, new in replacements:
              c = s.count(old)
              if c != 1:
                  raise SystemExit(f'floating_multiplication.rs: expected one {old!r}, found {c}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: cargo +stable fmt --all
      - name: Enforce bounded adaptation scope
        shell: bash
        run: |
          expected=$'crates/runen-core-ir/tests/floating_constants.rs\ncrates/runen-core-ir/tests/floating_division.rs\ncrates/runen-core-ir/tests/floating_multiplication.rs\ncrates/runen-core-ir/tests/floating_subtraction.rs\ncrates/runen-reference/tests/floating_multiplication.rs'
          actual="$(git diff --name-only)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Unexpected changed paths:" >&2
            echo "${actual}" >&2
            exit 1
          fi
      - run: cargo +stable test -p runen-core-ir --tests --no-run
      - run: cargo +stable test -p runen-reference --test floating_multiplication
      - name: Commit only forced fixture adaptations
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/runen-core-ir/tests/floating_constants.rs crates/runen-core-ir/tests/floating_division.rs crates/runen-core-ir/tests/floating_multiplication.rs crates/runen-core-ir/tests/floating_subtraction.rs crates/runen-reference/tests/floating_multiplication.rs
          git commit -m 'test: adapt floating fixtures for non-Copy ScalarType [skip-673-noncopy-fixtures]'
          git push origin HEAD:p0d-673-core-callable-values-impl
