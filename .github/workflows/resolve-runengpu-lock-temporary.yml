name: Temporary RunenGPU Lock Resolution

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Resolve dependency graph with Cargo
        run: |
          set -euo pipefail
          cargo +stable metadata --format-version 1 >/dev/null
          echo "RUNEN_LOCK_BEGIN"
          cat Cargo.lock
          echo "RUNEN_LOCK_END"
