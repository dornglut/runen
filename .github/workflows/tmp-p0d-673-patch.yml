              '    BasicBlockId, BorrowKind, CallableInterface, FunctionId, LoanDecl, LoanId, LocalId, Operand,\n    Place, PlaceAccess, Projection, ReferenceAccess, ReferencePermission, SafeReferenceResultContract,\n    ScalarType, Statement, TypeId, TypeKind, TypeTable, Value,',
          )
          once('    UnknownType(TypeId),\n', '    UnknownType(TypeId),\n    CallableTypeRequired(TypeId),\n')
          once(
              '''    for (index, function) in program.functions.iter().enumerate() {
        let function_id = function_id(index);
        validate_function_declarations(&program.types, function_id, function)?;
        validate_structure_and_static_rules(&program, function_id, function)?;
    }

    for (index, function) in program.functions.iter().enumerate() {
        validate_path_state(&program, function_id(index), function)?;
    }''',
              '''    for (index, function) in program.functions.iter().enumerate() {
        validate_function_declarations(&program.types, function_id(index), function)?;
    }

    for (index, function) in program.functions.iter().enumerate() {
        validate_structure_and_static_rules(&program, function_id(index), function)?;
    }

    for (index, function) in program.functions.iter().enumerate() {
        validate_path_state(&program, function_id(index), function)?;
    }''',
          )
          once(
              '''            TypeKind::Scalar(ScalarType::Reference {
                referent,
                permission,
            }) => {
                if types.get(*referent).is_none() {
                    return Err(program_error(MirValidationErrorKind::UnknownType(
                        *referent,
                    )));
                }
                if reference_pairs
                    .insert((*referent, *permission), ty)
                    .is_some()
                {
                    return Err(program_error(
                        MirValidationErrorKind::DuplicateReferenceType(ty),
                    ));
                }
            }
            TypeKind::Scalar(_) | TypeKind::Struct(_) => {}''',
              '''            TypeKind::Scalar(ScalarType::Reference {
                referent,
                permission,
            }) => {
                if types.get(*referent).is_none() {
                    return Err(program_error(MirValidationErrorKind::UnknownType(
                        *referent,
                    )));
                }
                if reference_pairs
                    .insert((*referent, *permission), ty)
                    .is_some()
                {
                    return Err(program_error(
                        MirValidationErrorKind::DuplicateReferenceType(ty),
                    ));
                }
            }
            TypeKind::Scalar(ScalarType::Callable(interface)) => {
                validate_callable_interface(types, interface, &MirLocation::Program)?;
            }
            TypeKind::Scalar(_) | TypeKind::Struct(_) => {}''',
