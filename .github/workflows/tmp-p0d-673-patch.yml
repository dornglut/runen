        Operand::FunctionValue(_) => Ok(DefinedStep::Continue(ValidationValue::Scalar(
            ValidationScalar::NonPointer,
        ))),
        Operand::Move(src) => {''',
          )

          # Location-polymorphic interface diagnostics.
          location_helper = r'''fn location_error(location: &MirLocation, kind: MirValidationErrorKind) -> MirValidationError {
    MirValidationError {
        location: location.clone(),
        kind,
    }
}

'''
          insert = text.index('fn point_error(')
          text = text[:insert] + location_helper + text[insert:]

          path.write_text(text)
