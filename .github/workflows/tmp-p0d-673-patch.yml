name: Temporary P0-D 673 patch

on:
  push:
    branches:
      - p0d-673-core-callable-values-impl

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-673-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0d-673-core-callable-values-impl
          persist-credentials: true
          fetch-depth: 0
      - name: Apply bounded validator patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/runen-core-ir/src/interprocedural_validation.rs')
          text = path.read_text()

          def once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          def between(start, end, replacement, search_from=0):
              global text
              a = text.index(start, search_from)
              b = text.index(end, a)
              text = text[:a] + replacement + text[b:]
              return a + len(replacement)

          once(
              'use crate::interprocedural::{Body, Function, Program, SafeReferenceResultContract, Terminator};',
              'use crate::interprocedural::{Body, Function, Program, Terminator};',
          )
