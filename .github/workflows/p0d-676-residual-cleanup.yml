name: Temporary P0-D 676 residual semantic cleanup

on:
  push:
    branches:
      - p0d-676-source-function-values-spec
    paths:
      - .github/workflows/p0d-676-residual-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: p0d-676-source-function-values-spec
      - name: Prove editing surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only 18c186a4007063a022d88e10961a8a502c9cacd7..HEAD | sort)" = "$(printf '%s\n' '.github/scripts/p0d_676_residual_cleanup.py' '.github/workflows/p0d-676-residual-cleanup.yml' | sort)"
      - name: Apply exact replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/p0d_676_residual_cleanup.py
          git diff --check
      - name: Commit normative cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aschenrot"
          git config user.email "128308156+aschenrot@users.noreply.github.com"
          git add spec/language/source
          test -n "$(git diff --cached --name-only)"
          git commit -m "docs: remove residual direct-only callable wording for #676"
          git push origin HEAD:p0d-676-source-function-values-spec
