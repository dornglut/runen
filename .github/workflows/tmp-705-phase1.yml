name: Temporary P0-D #705 workspace diagnostics

on:
  push:
    branches:
      - p0d-705-external-callable-impl

permissions:
  contents: write

concurrency:
  group: tmp-705-staged
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Prove accepted base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "8e7e0d36bf8e3c000295bd1d607297f024dfdbe4"
          test "$(git rev-parse 8e7e0d36bf8e3c000295bd1d607297f024dfdbe4^{tree})" = "0f637c32df99d3f6644f9cc2c2f33c6c6d5a9244"
      - name: Install maintained Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal
      - name: Apply complete staged implementation
        shell: bash
        run: |
          set -euo pipefail
          python .github/tmp-705-phase1.py
          python .github/tmp-705-phase1-fix.py
          python .github/tmp-705-phase2.py
          python .github/tmp-705-phase3.py
          python .github/tmp-705-phase4.py
          python .github/tmp-705-phase4-fix.py
          python .github/tmp-705-phase5-prep.py
          python .github/tmp-705-phase5-prep3.py
          python .github/tmp-705-phase5-diagnose.py
          python .github/tmp-705-phase5-script-fix.py
          python .github/tmp-705-phase5-script-fix2.py
          python .github/tmp-705-phase5.py
          python .github/tmp-705-phase5-test-fix.py
          python .github/tmp-705-phase6.py
          python .github/tmp-705-phase7.py
          python .github/tmp-705-phase8.py
          python .github/tmp-705-phase9.py
          python .github/tmp-705-phase10.py
          python .github/tmp-705-phase11.py
          cargo +stable fmt --all
          git diff --check
      - name: Capture workspace compiler diagnostics
        shell: bash
        run: |
          set +e
          cargo +stable check --workspace --all-targets --keep-going > .github/tmp-705-workspace-errors.txt 2>&1
          status=$?
          echo "cargo_status=$status" >> .github/tmp-705-workspace-errors.txt
          exit 0
      - name: Publish temporary diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp-705-workspace-errors.txt
          git commit -m "chore: record #705 workspace diagnostics [skip ci]"
          git push origin HEAD:p0d-705-external-callable-impl
