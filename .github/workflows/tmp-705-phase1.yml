name: Temporary P0-D #705 staged compiler gate

on:
  push:
    branches:
      - p0d-705-external-callable-impl

permissions:
  contents: read

concurrency:
  group: tmp-705-staged
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Prove accepted base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "8e7e0d36bf8e3c000295bd1d607297f024dfdbe4"
          test "$(git rev-parse 8e7e0d36bf8e3c000295bd1d607297f024dfdbe4^{tree})" = "0f637c32df99d3f6644f9cc2c2f33c6c6d5a9244"
      - name: Install maintained Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal
      - name: Apply staged implementation
        shell: bash
        run: |
          set -euo pipefail
          python .github/tmp-705-phase1.py
          python .github/tmp-705-phase1-fix.py
          python .github/tmp-705-phase2.py
          python .github/tmp-705-phase3.py
          python .github/tmp-705-phase4.py
          python .github/tmp-705-phase4-fix.py
          python .github/tmp-705-phase5-prep.py
          python .github/tmp-705-phase5-prep3.py
          python .github/tmp-705-phase5-diagnose.py
          python .github/tmp-705-phase5-script-fix.py
          python .github/tmp-705-phase5-script-fix2.py
          python .github/tmp-705-phase5.py
          python .github/tmp-705-phase5-test-fix.py
          cargo +stable fmt --all
          git diff --check
      - name: Test syntax external declarations
        shell: bash
        run: cargo +stable test -p runen-syntax --test external_callables
      - name: Test typed HIR external functions
        shell: bash
        run: cargo +stable test -p runen-hir --test external_callables
      - name: Test Core external-call substrate
        shell: bash
        run: cargo +stable test -p runen-core-ir --test external_callables
      - name: Test Core lowering external functions
        shell: bash
        run: cargo +stable test -p runen-core-lowering --test external_callables
      - name: Test reference provider admission and execution
        shell: bash
        run: cargo +stable test -p runen-reference --test external_callables
      - name: Compile changed libraries
        shell: bash
        run: |
          cargo +stable check -p runen-syntax --lib
          cargo +stable check -p runen-hir --lib
          cargo +stable check -p runen-core-ir --lib
          cargo +stable check -p runen-core-lowering --lib
          cargo +stable check -p runen-reference --lib
      - name: Enumerate remaining workspace obligations
        shell: bash
        run: cargo +stable check --workspace --all-targets
