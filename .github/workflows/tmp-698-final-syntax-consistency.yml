name: Temporary #698 final syntax consistency

on:
  push:
    branches:
      - tmp-698-final-syntax-consistency

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Reconstruct exact corrected candidate
        shell: bash
        env:
          BASE: 42a55ae6d9737c5240cdd530712bc964f8b4ec62
          OLD: 7a96415c8c9d54f351aded1a7dc4c342764fe47d
          TRANSFORM_BLOB: e7cd60ccd25d6005cb57dec36a10b95631075481
          FIXUP_BLOB: 6e7a97e5c07a65dc6d09ff57779447c9b8c36621
        run: |
          set -euo pipefail
          test "$(git hash-object .github/tmp-698-final-syntax-consistency.py)" = "$TRANSFORM_BLOB"
          test "$(git hash-object .github/tmp-698-final-syntax-fixup.py)" = "$FIXUP_BLOB"
          cp .github/tmp-698-final-syntax-consistency.py /tmp/runen-698-final-syntax-consistency.py
          cp .github/tmp-698-final-syntax-fixup.py /tmp/runen-698-final-syntax-fixup.py
          python3 /tmp/runen-698-final-syntax-fixup.py
          git checkout --detach "$OLD"
          python3 /tmp/runen-698-final-syntax-consistency.py
          git diff --check

          printf '%s\n' spec/language/source/concrete-syntax.md > /tmp/expected-correction-files
          git diff --name-only | sort > /tmp/actual-correction-files
          diff -u /tmp/expected-correction-files /tmp/actual-correction-files

          printf '%s\n' \
            spec/language/core/README.md \
            spec/language/core/faults.md \
            spec/language/core/functions.md \
            spec/language/core/persistent-storage.md \
            spec/language/core/references.md \
            spec/language/source/README.md \
            spec/language/source/closures.md \
            spec/language/source/concrete-syntax.md \
            spec/language/source/constants.md \
            spec/language/source/function-execution.md \
            spec/language/source/literals.md \
            spec/language/source/local-bindings.md \
            spec/language/source/names-modules.md \
            spec/language/source/references.md \
            spec/language/source/statics.md \
            | sort > /tmp/expected-total-files
          git diff --name-only "$BASE" | sort > /tmp/actual-total-files
          diff -u /tmp/expected-total-files /tmp/actual-total-files

          ! grep -Fq 'ConstReference' spec/language/source/concrete-syntax.md
          ! grep -Fq 'only the constant relation can succeed' spec/language/source/concrete-syntax.md
          ! grep -Fq 'For the module-constant branch' spec/language/source/concrete-syntax.md
          ! grep -Fq 'When local lookup fails and same-module lookup selects a constant in one of these binding-only forms' spec/language/source/concrete-syntax.md
          ! grep -Fq 'A resolved constant reference supplies `Exact(T)`' spec/language/source/concrete-syntax.md
          ! grep -Fq 'A module constant selected only after local lookup fails' spec/language/source/concrete-syntax.md
          ! grep -Fq 'A same-module constant reached after local lookup fails is a wrong category' spec/language/source/concrete-syntax.md
          grep -Fq 'module-static branch' spec/language/source/concrete-syntax.md
          grep -Fq 'static scalar read supplies `Exact(T)`' spec/language/source/concrete-syntax.md
          grep -Fq 'constant or static in a binding-only replacement' spec/language/source/concrete-syntax.md
          grep -Fq 'named constant/static module-scalar reference' spec/language/source/concrete-syntax.md
          grep -Fq 'static scalar read, safe-reference producer' spec/language/source/concrete-syntax.md
          grep -Fq 'module constant or static selected only after local lookup fails' spec/language/source/concrete-syntax.md
          grep -Fq 'preserved contract-bearing Shared-reference result whose target lies in any such persistent instance makes Core language validation fail' spec/language/core/functions.md
          grep -Fq 'This includes any carrier preserved in the outermost activation' spec/language/core/persistent-storage.md

          git add -- spec/language/source/concrete-syntax.md
          tree="$(git write-tree)"
          echo "$tree" > /tmp/candidate-tree
          echo "candidate tree: $tree"

      - name: Canonical repository validation
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          cargo +stable validate
          git diff --exit-code
          test "$(git write-tree)" = "$(cat /tmp/candidate-tree)"

      - name: Publish corrected atomic candidate
        shell: bash
        env:
          BASE: 42a55ae6d9737c5240cdd530712bc964f8b4ec62
          OLD: 7a96415c8c9d54f351aded1a7dc4c342764fe47d
          FEATURE_REF: refs/heads/p0d-698-immutable-shared-static-spec
        run: |
          set -euo pipefail
          tree="$(git write-tree)"
          test "$tree" = "$(cat /tmp/candidate-tree)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin "$FEATURE_REF" | cut -f1)" = "$OLD"
          export GIT_AUTHOR_NAME='Aschenrot'
          export GIT_AUTHOR_EMAIL='128308156+aschenrot@users.noreply.github.com'
          export GIT_COMMITTER_NAME='Aschenrot'
          export GIT_COMMITTER_EMAIL='128308156+aschenrot@users.noreply.github.com'
          candidate="$(printf '%s\n' 'P0-D: specify immutable Shared-addressable execution-static scalars' | git commit-tree "$tree" -p "$BASE")"
          test "$(git show -s --format=%P "$candidate")" = "$BASE"
          test "$(git show -s --format=%T "$candidate")" = "$tree"
          git push --force-with-lease="$FEATURE_REF:$OLD" origin "$candidate:$FEATURE_REF"
          echo "validated candidate: $candidate"
          echo "validated tree: $tree"
