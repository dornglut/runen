name: Temporary P0-D 676 corrected spec integration

on:
  push:
    branches:
      - p0d-676-source-function-values-spec
    paths:
      - .github/workflows/p0d-676-spec-transform-v2.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p0d-676-source-function-values-spec
      - name: Execute reviewed transform with corrected assertion
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/p0d-676-spec-transform.yml').read_text()
          start_marker = '      - name: Apply exact normative integration\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Commit exact integration\n'
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('unable to isolate reviewed transform script')
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(script)
          old = '2. `T` is duplicable under the source-semantic duplicability relation from `types.md`;\\n3. the structural source value shape'
          new = '2. `T` is duplicable under the source-semantic duplicability relation from `types.md`; and\\n3. the structural source value shape'
          if script.count(old) != 1:
              raise SystemExit(f'expected one corrected assertion site, found {script.count(old)}')
          script = script.replace(old, new, 1)
          exec(compile(script, '<p0d-676-reviewed-transform>', 'exec'), {'__name__': '__main__'})
      - name: Commit normative files only
        run: |
          git config user.name "Aschenrot"
          git config user.email "128308156+aschenrot@users.noreply.github.com"
          git add spec/language/source
          git diff --cached --check
          git commit -m "spec: integrate source function values across owners"
          git push origin HEAD:p0d-676-source-function-values-spec