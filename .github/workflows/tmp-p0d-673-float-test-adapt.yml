name: Temporary P0-D 673 float-test adaptation

on:
  push:
    branches:
      - p0d-673-core-callable-values-impl

permissions:
  contents: write

jobs:
  adapt:
    if: ${{ !contains(github.event.head_commit.message, '[skip-673-float-adapt]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p0d-673-core-callable-values-impl
          persist-credentials: true
          fetch-depth: 0
      - name: Apply compile-only adaptation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/runen-core-ir/tests/floating_addition.rs')
          s = p.read_text()
          replacements = {
              'TypeDef::scalar(format!("float-{index}"), scalar)': 'TypeDef::scalar(format!("float-{index}"), scalar.clone())',
              'left: Operand::Constant(zero_value(scalar)),': 'left: Operand::Constant(zero_value(scalar.clone())),',
              'right: Operand::Constant(zero_value(scalar)),': 'right: Operand::Constant(zero_value(scalar.clone())),',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: cargo fmt --all --check
      - run: cargo test -p runen-core-ir --test floating_addition
      - name: Commit adaptation only
        shell: bash
        run: |
          git diff --name-only
          test "$(git diff --name-only)" = 'crates/runen-core-ir/tests/floating_addition.rs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/runen-core-ir/tests/floating_addition.rs
          git commit -m 'test: adapt floating fixture for non-Copy ScalarType [skip-673-float-adapt]'
          git push origin HEAD:p0d-673-core-callable-values-impl
